<!DOCTYPE html>
<html>
<head>
  <title>BrickMart</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      color: #b22222;
    }

    .card {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    input {
      padding: 8px;
      margin: 5px;
      width: 80%;
    }

    button {
      background: green;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<h1>🧱 BrickMart</h1>

<div class="card">
  <h2>Order Bricks</h2>

  <input type="text" id="name" placeholder="Enter your name"><br>
  <input type="number" id="phone" placeholder="Enter phone number"><br>
  <input type="number" id="qty" placeholder="Enter quantity"><br><br>

  <button onclick="placeOrder()">Place Order</button>
</div>

<script>
function placeOrder() {
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let qty = document.getElementById("qty").value;

  if(name === "" || phone === "" || qty === "") {
    alert("Please fill all details!");
  } else {
    alert("Order placed successfully!\nName: " + name + "\nQty: " + qty);
  }
}
</script>

</body>
</html>>
