<!DOCTYPE html>
<html>
<head>
  <title>BrickMart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f1f3f6;
    }

    /* Header */
    .header {
      background: #2874f0;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* Product Grid */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    /* Card */
    .card {
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 5px gray;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
    }

    .price {
      color: green;
      font-weight: bold;
    }

    button {
      background: #fb641b;
      color: white;
      border: none;
      padding: 8px;
      width: 100%;
      border-radius: 5px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="header">🧱 BrickMart</div>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Red Bricks</h3>
    <p class="price">₹5000</p>
    <button onclick="order()">Order Now</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Fly Ash Bricks</h3>
    <p class="price">₹4500</p>
    <button onclick="order()">Order Now</button>
  </div>

</div>

<script>
function order() {
  alert("Order placed successfully!");
}
</script>

</body>
</html>
