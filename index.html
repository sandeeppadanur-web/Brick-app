<!DOCTYPE html>
<html>
<head>
  <title>BrickMart</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      color: #b22222;
    }

    .card {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    button {
      background: green;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<h1>🧱 BrickMart</h1>

<div class="card">
  <h2>Red Bricks</h2>
  <p>Price: ₹5000</p>
  <button onclick="alert('Order placed!')">Order Now</button>
</div>

<div class="card">
  <h2>Fly Ash Bricks</h2>
  <p>Price: ₹4500</p>
  <button onclick="alert('Order placed!')">Order Now</button>
</div>

</body>
</html>
